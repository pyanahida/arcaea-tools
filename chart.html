<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>谱面长图(Tap, Hold) | 配色优化</title>
<link rel="stylesheet" href="./chart.css">
<link rel="stylesheet" href="./main.css">
</head>
<body>

<div id="chartDiv" hidden><svg
    id="chart"
    xmlns="http://www.w3.org/2000/svg"
    width="400" height="0"
    viewBox="0 0 400 0">
</svg></div>

<input class="full" type="file" id="file" accept=".aff">
<button class="full" id="parse">解析并绘制</button>

<p id="level"></p>
<input class="full" id="zoom" value="80" placeholder="缩放建议: 30-150">

<script>
try {

// Variable
let data = [];
let level = 0;

// DOM & CONST
const getFile = document.getElementById('file');
const getZoom = document.getElementById('zoom');
const parseBtn = document.getElementById('parse');
const chart = document.getElementById('chart');
const chartArea = document.getElementById('chartDiv');
const levelTxt = document.getElementById('level');

const AcceptName = /^[0-4]\.aff$/;
const TapExpr = /\(\d+,[1-4]\);/;
const HoldExpr = /hold\(\d+,\d+,[1-4]\);/;
const TimingExpr = /timing\(\d+,\d+\.\d\d,\d+\.\d\d\);/;
const NS = "http://www.w3.org/2000/svg";
const HoldGradient = `
<linearGradient id="hold_gradient" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#5799B1" />
    <stop offset="1%"   stop-color="#B3DBE7" />
    <stop offset="30%"  stop-color="#B3D1ED" />
    <stop offset="55%"  stop-color="#B8C3F0" />
    <stop offset="75%"  stop-color="#BCB9F2" />
    <stop offset="99%"  stop-color="#C8B6F4" />
    <stop offset="100%" stop-color="#FBD0FD" />
</linearGradient>
`;
const TapGradient = `
<linearGradient id="tap_gradient" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#33A3E3" />
    <stop offset="5%"   stop-color="#1797D4" />
    <stop offset="23%"  stop-color="#4DBADB" />
    <stop offset="52%"  stop-color="#79CBE3" />
    <stop offset="99%"  stop-color="#7CC7DE" />
    <stop offset="100%" stop-color="#8BBECF" />
</linearGradient>
`;

// Get File
getFile.addEventListener('change', async function () {
    const file = this.files[0];
    
    // Check name
    if (!AcceptName.test(file.name)) {
        alert('仅支持 AFF 文件，0～4.aff');
        this.value = '';
        return;
    }
    
    try {
        // Read
        const text = await file.text();

        // Check empty
        if (!text.trim()) {
            alert('文件内容为空');
            this.value = '';
            data = [];
            return;
        }

        // Save
        data = text.split('\n');
        level = parseInt(file.name[0], 10);
    } catch (e) {
        alert('文件读取失败');
        this.value = '';
        data = [];
    }
});

parseBtn.addEventListener('click', () => {

chartArea.hidden = false;
chart.innerHTML = `
<defs>
${HoldGradient}
${TapGradient}
</defs>
`;

// Keys
let taps = [];
let holds = [];
let timings = [];
let height = 0;

// Controls
let zoom = parseInt(getZoom.value, 10);
if (Number.isNaN(zoom)) {
    zoom = 1;
}
else if (zoom <= 0) {
    zoom = 1;
}
else {
    zoom /= 100;
}

// Traverse
for (let i of data) {
    if (TapExpr.test(i)) {
        let parsed = i.replace(/[();]/g, '');
        parsed = parsed.split(',');
        taps.push(parsed);
    }
    if (HoldExpr.test(i)) {
        let parsed = i.replace(/[();]/g, '').slice(4);
        parsed = parsed.split(',');
        holds.push(parsed);
    }
    if (TimingExpr.test(i)) {
        let parsed = i.replace(/[();]/g, '').slice(6);
        parsed = parsed.split(',');
        timings.push(parsed);
    }
}

// Timing check
if (timings.length === 0) {
    alert("不是合法的 Arcaea 谱面文件");
}

// Render
// Find the maximum height simultaneously
for (let t of taps) {
    const rect = document.createElementNS(NS, 'rect');
    rect.setAttribute('x', (t[1] - 1) * 100);
    rect.setAttribute('y', t[0] * zoom);
    rect.setAttribute('width', 100);
    rect.setAttribute('height', 20);
    rect.setAttribute('fill', 'url(#tap_gradient)');
    chart.appendChild(rect);
    
    // Finding height
    if (t[0] > height) height = t[0];
}
for (let h of holds) {
    // Start >= End
    if (h[0] >= h[1]) {
        continue;
    }
    
    const rect = document.createElementNS(NS, 'rect');
    rect.setAttribute('x', (h[2] - 1) * 100);
    rect.setAttribute('y', h[0] * zoom);
    rect.setAttribute('width', 100);
    rect.setAttribute('height', (h[1] - h[0]) * zoom);
    rect.setAttribute('fill', 'url(#hold_gradient)');
    chart.appendChild(rect);
    
    // Finding height
    if (h[1] > height) height = h[1];
}

// Level
let levelStr = "";
switch (level) {
    case 0: levelStr = "Past"; break;
    case 1: levelStr = "Present"; break;
    case 2: levelStr = "Future"; break;
    case 3: levelStr = "Beyond"; break;
    case 4: levelStr = "Eternal"; break;
    default: levelStr = "Null";
}
levelTxt.textContent = levelStr;

// Lines
let time = 0;
for (let i = 0; i < timings.length; i++) {
    const t = timings[i];
    
    const bpm = t[1];
    const beat = t[2];
    const keepTime = Math.floor(beat / bpm * 60 * 1000);
    
    // If there is another item
    if (i + 1 < timings.length) {
    while (time < timings[i+1][0]) {
        const line = document.createElementNS(NS, 'line');
        line.setAttribute('x1', 0);
        line.setAttribute('x2', 400);
        line.setAttribute('y1', time * zoom);
        line.setAttribute('y2', time * zoom);
        line.setAttribute('stroke-width', 1);
        line.setAttribute('stroke', '#CCC');
        chart.appendChild(line);
        time += keepTime;
    }
    }
    // This is the last item
    else {
    while (time < height) {
        const line = document.createElementNS(NS, 'line');
        line.setAttribute('x1', 0);
        line.setAttribute('x2', 400);
        line.setAttribute('y1', time * zoom);
        line.setAttribute('y2', time * zoom);
        line.setAttribute('stroke-width', 1);
        line.setAttribute('stroke', '#CCC');
        chart.appendChild(line);
        time += keepTime;
    }
    }
}

// 轨道边界线
for (let i = 0; i <= 400; i += 100) {
    const line = document.createElementNS(NS, 'line');
    line.setAttribute('x1', i);
    line.setAttribute('x2', i);
    line.setAttribute('y1', 0);
    line.setAttribute('y2', height * zoom);
    line.setAttribute('stroke-width', 1);
    line.setAttribute('stroke', '#6C6577');
    chart.appendChild(line);
}

// Height
height *= zoom;
chart.setAttribute('height', height);
chart.setAttribute('viewBox', `0 0 400 ${height}`);

window.scrollTo(0, document.body.scrollHeight);

});

} catch (e) {
    console.log(e);
}
</script>
</body>
</html>
